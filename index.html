    <meta name="color-scheme" content="light">
    <script>
        try {
            const savedScheme = localStorage.getItem("color-scheme");
            const isDark = savedScheme === "dark";
            document.querySelector('meta[name="color-scheme"]').content = isDark ? "dark" : "light";
            document.documentElement.dataset.theme = isDark ? "dark" : "light";
            if (isDark) document.documentElement.classList.add("dark");
            else document.documentElement.classList.remove("dark");
        } catch {}
    </script>

    <!-- Shared component classes (form controls, buttons, cards) -->
    <style type="text/tailwindcss">
        @layer components {
            .field-label { @apply mb-1.5 block text-[13px] font-medium text-ink; }
            .input {
                @apply w-full rounded-lg border border-line bg-white px-3 py-2.5 text-body text-ink
                       placeholder:text-disabled transition-colors duration-150
                       focus:border-navy focus:outline-none focus:ring-2 focus:ring-navy/15
                       disabled:cursor-not-allowed disabled:bg-page disabled:text-muted;
            }
            .input-error { @apply border-danger focus:border-danger focus:ring-danger/15; }
            .btn {
                @apply inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-lg px-4 py-2.5
                       text-[14px] font-semibold transition-colors duration-150
                       disabled:cursor-not-allowed disabled:opacity-60;
            }
            .btn-sm { @apply px-3 py-1.5 text-[13px]; }
            .btn-primary { @apply bg-navy text-white hover:bg-navy-700; }
            .btn-secondary { @apply border border-line bg-white text-ink hover:bg-page; }
            .btn-danger { @apply bg-danger text-white hover:bg-danger/90; }
            .btn-ghost { @apply text-navy hover:bg-mist; }
            .card { @apply rounded-xl border border-line bg-white shadow-card; }
        }
    </style>
